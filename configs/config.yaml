mode: "research"

deid:
  model: "OpenMed/OpenMed-PII-GTEMed-Base-149M-v1"   

deid_check:
  low_threshold:  0.60   # below this → REVIEW
  high_threshold: 0.85   # above this → confident
  script: true
  regex: true

ner:
  model: "d4data/biomedical-ner-all"
  min_score: 0.30

ner_check:
  review_threshold: 0.60

snomed:
  enabled: false


paths:
  input:     "data/"
  privacy:   "outputs/privacy/"
  medical:   "outputs/medical/"
  logs:      "outputs/logs.jsonl"

schema_version: "0.0.1"
