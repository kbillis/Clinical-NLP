mode: "research"

deid:
  model: "OpenMed/OpenMed-PII-GTEMed-Base-149M-v1"

deid_check:
  low_threshold: 0.20
  high_threshold: 0.90
  script: true
  regex: true

ner:
  model: "d4data/biomedical-ner-all"
  min_score: 0.20              # lower — capture everything for evaluation

ner_check:
  review_threshold: 0.50

snomed:
  enabled: false

paths:
  input:     "data/"
  privacy:   "outputs/privacy/"
  medical:   "outputs/medical/"
  logs:      "outputs/logs.jsonl"

schema_version: "0.0.1"
